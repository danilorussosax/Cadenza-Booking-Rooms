;; Cadenza — PgBouncer locale dedicato (dev). Transaction pooling.
;; Isolato da Gestimus (:6433) e dall'istanza EDB (:6432).
;; L'app Cadenza punta qui via .env: DB_PGBOUNCER=true, DB_PORT=6434.
;; Avvio:  pgbouncer -d backend/config/pgbouncer/pgbouncer.ini
;; Stop:   kill "$(cat backend/config/pgbouncer/pgbouncer.pid)"
;; Reload: kill -HUP "$(cat backend/config/pgbouncer/pgbouncer.pid)"

[databases]
cadenza = host=127.0.0.1 port=5432 dbname=cadenza

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6434
auth_type = scram-sha-256
auth_file = /Users/danilorusso/Desktop/WEBAPP/Cadenza/backend/config/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 0
reserve_pool_size = 5
server_idle_timeout = 120
; In transaction pooling questi startup parameter dell'app vanno accettati.
; ATTENZIONE: pgbouncer li IGNORA (non li inoltra). statement_timeout /
; idle_in_transaction_session_timeout vanno quindi imposti a livello DB
; (ALTER DATABASE cadenza SET ...) per restare effettivi.
ignore_startup_parameters = extra_float_digits, statement_timeout, idle_in_transaction_session_timeout
logfile = /Users/danilorusso/Desktop/WEBAPP/Cadenza/backend/config/pgbouncer/pgbouncer.log
pidfile = /Users/danilorusso/Desktop/WEBAPP/Cadenza/backend/config/pgbouncer/pgbouncer.pid
