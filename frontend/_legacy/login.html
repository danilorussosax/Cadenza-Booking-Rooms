<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi — Conservatorio</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-poster">
      <div class="poster-content">
        <div class="institute-badge" id="institute-badge">
          <div class="logo" id="institute-logo"></div>
          <div class="name" id="institute-name">Conservatorio</div>
        </div>
        <h1 id="institute-title">Sistema<br><em>Prenotazione Aule</em></h1>
        <p id="institute-tagline">"Il silenzio è il solido sfondo<br>su cui la musica si disegna."</p>
      </div>
    </div>

    <div class="auth-form-wrap">
      <div class="auth-form">
        <h2>Accedi</h2>
        <p class="auth-subtitle">Bentornato — pronto a studiare?</p>

        <div id="error-box"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Entra</button>
        </form>

        <div class="divider">oppure</div>

        <div class="oauth-btns">
          <a href="/api/auth/google" class="oauth-btn">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continua con Google
          </a>
          <a href="/api/auth/microsoft" class="oauth-btn">
            <svg viewBox="0 0 24 24"><path fill="#F25022" d="M1 1h10v10H1z"/><path fill="#7FBA00" d="M13 1h10v10H13z"/><path fill="#00A4EF" d="M1 13h10v10H1z"/><path fill="#FFB900" d="M13 13h10v10H13z"/></svg>
            Continua con Microsoft
          </a>
        </div>

        <p class="auth-foot">
          Non hai un account? <a href="/register.html">Registrati qui</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Se già loggato → dashboard
    if (Auth.isAuthenticated()) window.location.href = '/dashboard.html';

    // Visualizza nome + logo dell'istituto (se configurato)
    document.getElementById('institute-logo').innerHTML = ICONS.brand;
    Institute.getPublic().then(inst => {
      if (!inst) return;
      if (inst.name) document.getElementById('institute-name').textContent = inst.name;
      if (inst.logoUrl) {
        document.getElementById('institute-logo').innerHTML =
          `<img src="${inst.logoUrl}" alt="${escapeHtml(inst.name || '')}">`;
      }
    });

    // Errori da OAuth
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === 'oauth_failed') {
      document.getElementById('error-box').innerHTML =
        '<div class="alert error">Errore durante l\'autenticazione OAuth. Riprova o usa email/password.</div>';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span>';
      try {
        const data = await api('/auth/login', { method: 'POST', body: { email, password } });
        Auth.setToken(data.token);
        Auth.setUser(data.user);
        if (data.user.role !== 'admin' && (!data.user.matricola || !data.user.courseId)) {
          window.location.href = '/complete-profile.html';
        } else {
          window.location.href = '/dashboard.html';
        }
      } catch (err) {
        document.getElementById('error-box').innerHTML =
          `<div class="alert error">${escapeHtml(err.message)}</div>`;
        btn.disabled = false;
        btn.textContent = 'Entra';
      }
    });
  </script>
</body>
</html>
