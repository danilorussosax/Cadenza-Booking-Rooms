<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Cadenza">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgb(15,23,42)"/>
      <stop offset="100%" stop-color="rgb(28,56,115)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.65" r="0.55">
      <stop offset="0%" stop-color="rgba(243,148,5,0.55)"/>
      <stop offset="100%" stop-color="rgba(243,148,5,0)"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1024" height="1024" rx="225" ry="225"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <!-- bars (low-mid-HIGH-mid-low) -->
    <rect x="134" y="562" width="84" height="236" rx="25" ry="25" fill="rgb(245,232,200)" />
    <rect x="302" y="359" width="84" height="439" rx="25" ry="25" fill="white" />
    <rect x="470" y="235" width="84" height="563" rx="25" ry="25" fill="rgb(243,148,5)" />
    <rect x="638" y="359" width="84" height="439" rx="25" ry="25" fill="white" />
    <rect x="806" y="562" width="84" height="236" rx="25" ry="25" fill="rgb(245,232,200)" />
    <!-- arc -->
    <path d="M 50 218 A 462 168 0 0 1 974 218" stroke="rgb(245,232,200)" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.85"/>
    <!-- fermata -->
    <circle cx="512" cy="40" r="18" fill="white" opacity="0.95"/>
  </g>
  <rect x="32" y="32" width="960" height="960" rx="205" ry="205"
        fill="none" stroke="white" stroke-opacity="0.10" stroke-width="3"/>
</svg>
