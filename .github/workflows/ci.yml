name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Cancella run precedenti sullo stesso branch quando arriva un nuovo push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + test + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

  backend-postgres:
    # Job dedicato per i test che richiedono un Postgres reale (suffisso
    # *.postgres.test.js). Tipicamente: EXCLUDE constraint e analytics
    # aggregations (EXTRACT/date_trunc/::int Postgres-only). Il job backend
    # principale gira su SQLite in-memory: questi test sono "skipped" lì e
    # vengono eseguiti separatamente qui.
    name: Backend · Postgres-only tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cadenza
          POSTGRES_PASSWORD: cadenza
          POSTGRES_DB: cadenza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadenza"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DB_DIALECT: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: cadenza_test
      DB_USER: cadenza
      DB_PASSWORD: cadenza
      DB_SSL: "false"
      DB_LOGGING: "false"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Postgres-only tests
        run: npx vitest run "tests/**/*.postgres.test.js" tests/integration/excludeConstraint.test.js

  frontend:
    name: Frontend · typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # E2E è il job più costoso: lo eseguiamo solo su push a main/develop e
    # sulle PR esplicitamente labellate `e2e` per non rallentare le PR rapide.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      # Installa deps per i tre progetti
      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend (serve da backend in test)
        working-directory: frontend
        run: npm run build

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      # Cache dei browser di Playwright per evitare il download ogni run.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npm test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
