# Dependabot — aggiornamenti settimanali delle dipendenze.
#
# Cadenza ha 4 workspace npm indipendenti (ognuno con il proprio lockfile) più
# le GitHub Actions. Policy:
#   - ogni lunedì (Europe/Rome), una PR per directory con tutti i minor+patch;
#   - cooldown: nessuna PR per versioni pubblicate da meno di 14 giorni (30 per i major);
#   - i major arrivano sempre in PR separate (vanno valutati a mano);
#   - le PR di sicurezza di Dependabot restano separate e immediate.
#
# Prefisso commit: "chore(deps): ..." / "chore(deps-dev): ..." (tipo `chore`
# valido per commitlint.config.cjs). Per le GitHub Actions: "ci(deps): ...".
#
# Nota: nessun `ignore` su sequelize-cli. Le sue vulnerabilità moderate sono
# transitive (glob/minimatch/js-beautify) e non richiedono di bloccare i major:
# la PR di major, se arriva, si chiude a mano.

version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    # Non proporre versioni appena pubblicate: attende prima che emergano
    # regressioni o pacchetti ritirati (le correzioni di sicurezza ignorano la pausa).
    cooldown:
      default-days: 14
      semver-major-days: 30
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

